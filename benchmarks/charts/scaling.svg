<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 520">
<title id="title">Peak memory by reconciliation workload</title>
<desc id="desc">Same correctness workload at 100K and 1M rows per provider source Peak RSS from resource.getrusage; current implementation uses in-memory Pandas</desc>
<rect width="900" height="520" rx="18" fill="#0f172a"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:24px;font-weight:700;fill:#f8fafc}.subtitle{font-size:13px;fill:#94a3b8}.axis{font-size:12px;fill:#cbd5e1}.value{font-size:12px;font-weight:700;fill:#f8fafc}.label{font-size:13px;font-weight:600;fill:#e2e8f0}.grid{stroke:#334155;stroke-width:1}.baseline{stroke:#94a3b8;stroke-width:1.5}</style>
<text class="title" x="32" y="38">Peak memory by reconciliation workload</text>
<text class="subtitle" x="32" y="64">Same correctness workload at 100K and 1M rows per provider source</text>
<line class="grid" x1="100" y1="405.0" x2="865" y2="405.0"/>
<text class="axis" text-anchor="end" x="88" y="409.0">0</text>
<line class="grid" x1="100" y1="330.0" x2="865" y2="330.0"/>
