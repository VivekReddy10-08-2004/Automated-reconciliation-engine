<rect x="216.2" y="340.3" width="150.0" height="64.7" rx="6" fill="#38bdf8"/>
<text class="value" text-anchor="middle" x="291.2" y="331.3">276 MB</text>
<text class="axis" text-anchor="middle" x="291.2" y="429">100,000 rows</text>
