<text class="axis" text-anchor="end" x="88" y="259.0">640</text>
<line class="grid" x1="100" y1="180.0" x2="865" y2="180.0"/>
<text class="axis" text-anchor="end" x="88" y="184.0">959</text>
<line class="grid" x1="100" y1="105.0" x2="865" y2="105.0"/>
