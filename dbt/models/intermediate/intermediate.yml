version: 2

models:
  - name: int_equity_pairs
    description: Expected Yahoo, Alpaca, and Massive provider pairs by run, symbol, and trade date.
    columns:
      - name: run_id
        data_tests:
          - not_null
      - name: symbol
        data_tests:
          - not_null
      - name: trade_date
        data_tests:
          - not_null
      - name: source_a
        data_tests:
          - not_null
      - name: source_b
        data_tests:
          - not_null
