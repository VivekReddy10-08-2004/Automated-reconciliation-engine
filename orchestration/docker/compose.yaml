name: automated-reconciliation-engine

services:
  batch:
    image: automated-reconciliation-engine-batch:local
    build:
      context: ../..
      dockerfile: orchestration/docker/Dockerfile
    env_file:
      - ../../project.env
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - -m
      - reconciliation_engine.batch
      - --db
      - /app/state/reconciliation.duckdb
      - --data-root
      - /app/state/data
    volumes:
      - reconciliation-state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

volumes:
  reconciliation-state:
    name: automated-reconciliation-engine-state
