[project]
name = "financial-reconciliation-engine"
version = "1.0.0"
description = "Automated Financial Data Ingestion & Reconciliation Engine"
requires-python = ">=3.10"
dependencies = [
    "pyzmq",
    "websockets",
    "scikit-learn",
    "yfinance",
    "alpaca-py",
    "python-dotenv",
    "pandas",
    "numpy",
    "SQLAlchemy",
    "requests",
    "duckdb",
    "dbt-duckdb",
    "rich",
    "fastapi",
    "uvicorn",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
]

[tool.uv]
package = false
